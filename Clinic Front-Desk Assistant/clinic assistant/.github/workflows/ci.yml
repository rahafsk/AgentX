name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinic_assistant
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_user -d clinic_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://clinic_user:ci-local-password@localhost:5432/clinic_assistant
      LLM_MODE: fake
      LLM_TIMEOUT_SECONDS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check app tests

      - name: Check formatting
        run: uv run ruff format --check app tests

      - name: Type-check
        run: uv run mypy app

      - name: Run tests when test modules exist
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest
          else
            echo "::notice::No pytest modules exist yet; skipping tests until test files are added."
          fi
