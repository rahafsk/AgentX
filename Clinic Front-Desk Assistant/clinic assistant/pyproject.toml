[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-front-desk-assistant"
version = "0.1.0"
description = "Backend REST API and safe clinic front-desk assistant workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "langgraph>=0.2,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "fastmcp>=4.1.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "mcp_servers",
]
